name: Check links

# The guide links to Learn WordPress courses and WordPress help pages, which
# sometimes move. Once a month, check them and open an issue if any broke.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 src/landing/content.ts src/generator/index.ts TRANSLATING.md README.md
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in the guide
          content-filepath: ./lychee/out.md
          labels: links
