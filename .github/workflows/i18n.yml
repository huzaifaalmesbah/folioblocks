name: Translations

# Translators never have to run a script:
# - On a pull request, check the language files (valid JSON, placeholders and
#   links kept) and print how much of each language is translated.
# - On main, bring every language folder in step with the code (new English
#   strings added, unused ones dropped, new folders loaded), rebuild the
#   command line bundle that includes them, and commit that.

on:
  pull_request:
    paths: ['src/**', 'scripts/i18n-*.ts', 'scripts/build-cli.ts', 'package*.json']
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the translations
        run: npm run i18n:check
      - name: Load every language folder, then run the tests
        run: |
          npm run i18n:extract
          npm test

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run i18n:extract
      - run: npm run i18n:check
      # The command line bundle includes the language files, so rebuild it with them.
      - run: npm run build:cli
      - name: Commit the updated files
        run: |
          if git diff --quiet -- src/i18n/locales cli; then
            echo "Language files and the command line are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/locales cli
          git commit -m "Update language files and the command line from the code"
          git push
